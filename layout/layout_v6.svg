<text x="1526.0" y="175.5" text-anchor="middle" font-size="10" font-weight="400" fill="#0F172A">· 메인 NG도 재검사 라인 → 재검사기 통과 (계측 생략) → NG OUT</text>
<text x="1526.0" y="187.5" text-anchor="middle" font-size="10" font-weight="400" fill="#0F172A">· 삭제: 정치 버퍼 8칸(v6) · M1710 라인 · M1650 · 루프백 · BYPASS</text>
<text x="1526.0" y="199.5" text-anchor="middle" font-size="10" font-weight="400" fill="#0F172A">· 랙 6열 × 4단 = 24칸, 칸 크기 동일 (4S 1~3열 · 6S 4~6열)</text>
<text x="1526.0" y="211.5" text-anchor="middle" font-size="10" font-weight="400" fill="#0F172A">· 카운터 D1900 GOOD · D1901 NG · D1902 격리 · D1903 합계 · D1904 수율</text>
<text x="42.0" y="22.0" text-anchor="start" font-size="15" font-weight="700" fill="#0F172A">Project B 상면 레이아웃 — v6 (정치 버퍼 없는 연속 재검사 라인 · 1차/2차 분리) · 1칸 = 1 m</text>
<text x="42.0" y="48.0" text-anchor="start" font-size="10" font-weight="400" fill="#475569">흐름: 투입 → RFID①·비전 → 랙 4S/6S 숙성(온도 감시) → 크레인 B 동쪽 출구 → 1차 분리(발열 ↓ 격리) → RFID② 메인 검사 → GOOD / RETEST·NG → 재검사 라인(연속) → RFID③ 재검사기 → 2차 분리(GOOD ↑ 합류 / NG ↓)</text>
